
name: Build NovaAnimations

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '2.14.1'

      - name: Compile NovaAnimations
        run: gradle clean build --stacktrace

      - name: Upload Minecraft Mod
        uses: actions/upload-artifact@v4
        with:
          name: NovaAnimations-1.8.9
          path: build/libs/*.jar
